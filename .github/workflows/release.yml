name: Release

on:
  push:
    tags:
      - "v*" #check for tags starting with "v"

permissions:
  contents: write
  packages: write


jobs:
  release:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image owner
        id: image_owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and start services using docker compose
        run: docker compose up -d --build

      - name: Wait for services
        run: sleep 10

      - name: Bootstrap database
        run: docker compose exec -T backend python -m scripts.sync_mongo_data --drop-existing

      - name: Check backend API
        run: curl --fail http://127.0.0.1:8000/api/alerts/today

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ steps.image_owner.outputs.owner }}/redalert-backend:${{ github.ref_name }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ steps.image_owner.outputs.owner }}/redalert-frontend:${{ github.ref_name }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
