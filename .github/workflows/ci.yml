name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest   
    steps:

      - name: Checkout code
        uses: actions/checkout@v4 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
     
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run tests
        run: python -m pytest backend/tests -q