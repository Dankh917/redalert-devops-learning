name: CI

on:
  push:
  pull_request:
    

jobs:

  backend-tests:
    runs-on: ubuntu-latest   
    steps:

      - name: Checkout code
        uses: actions/checkout@v4 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
     
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run tests
        run: python -m pytest backend/tests -q

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: build and start services using docker compose  
        run: docker compose up -d --build
      
      - name: Wait for services
        run: sleep 10

      - name: Bootstrap database
        run: docker compose exec -T backend python -m scripts.sync_mongo_data --drop-existing

      - name: Check backend API
        run: curl --fail http://127.0.0.1:8000/api/alerts/today


      

    
    

